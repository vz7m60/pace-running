name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name, for example 1.0.1
        required: true
        type: string
        default: "1.0.1"
      version_code:
        description: Must be greater than the previous release
        required: true
        type: number
        default: 2

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pace-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/pace-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pace-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Add ANDROID_STORE_PASSWORD and ANDROID_KEY_ALIAS in repository Actions secrets."
            exit 1
          fi
          if [ "$ANDROID_VERSION_CODE" -le 1 ]; then
            echo "::error::version_code must be greater than 1 for the first release."
            exit 1
          fi
          gradle --no-daemon -p android-app :app:assembleRelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PACE-Android-v${{ inputs.version_name }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pace-v${{ inputs.version_name }}
          target_commitish: main
          name: PACE Android v${{ inputs.version_name }}
          draft: true
          generate_release_notes: true
          files: android-app/app/build/outputs/apk/release/app-release.apk
